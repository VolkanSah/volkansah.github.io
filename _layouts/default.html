<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Früh setzen: Nav-Links verstecken sich nur, wenn JS läuft (ohne JS: normal sichtbar) -->
    <script>document.documentElement.classList.add('js');</script>

    <meta name="theme-color" content="#0D1117">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | default: 'Volkan Sah' | escape }}" href="{{ '/feed.xml' | absolute_url }}">

    <!-- Link-Previews (Discord, WhatsApp, Signal ...) -->

    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: 'Volkan Sah' | escape }}">
    <meta property="og:description" content="{{ page.description | default: 'Ai Code Craft — development with passion' | escape }}">

    <!-- Favicon inline — kein extra Request, kein 404 mehr -->

    <!-- Warm-up: nur noch GitHub-API + Bilder (Bootstrap/FontAwesome/jQuery/Masonry sind raus) -->
    <link rel="preconnect" href="https://api.github.com" crossorigin>
    <link rel="preconnect" href="https://raw.githubusercontent.com">

<style>
/* ---------- base ---------- */
body { background-color: #0D1117; color: #C9D1D9; }
a { color: #58A6FF; }
a:hover { color: #1F6FEB; }
.btn { border-radius: 2px; }
.close { color: #58A6FF; font-size: 1.5em; }

.card {
    background-color: #161B22;
    border: 1px solid #05172c;
    border-radius: 2px;
    box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.5);
}
.navbar { background-color: #161B22; }

/* Smooth scroll nur für Leute, die Bewegung mögen */
@media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
    .modal-body { scroll-behavior: smooth; }
}

/* Modal */
.modal.fade .modal-dialog {
    transition: transform 0.25s ease-out, opacity 0.25s ease-out;
    transform: translateY(-12px);
}
.modal.show .modal-dialog { transform: translateY(0); }
.modal .modal-content {
    background-color: #0D1117; color: #C9D1D9;
    border: 1px solid #05172c; border-radius: 2px;
}
.modal .modal-header,
.modal .modal-footer { border: none; }
.modal-content p { text-align: justify; }
.modal-style-service { list-style-type: none; }

/* ---------- skip link ---------- */
.skip {
    position: absolute; left: .8rem; top: .6rem; z-index: 2000;
    transform: translateY(-300%);
    background: #58A6FF; color: #0D1117;
    font-family: 'Fira Code', monospace; font-size: 13px;
    padding: .5rem .8rem; border-radius: 2px;
}
.skip:focus { transform: none; text-decoration: none; }

/* ---------- typewriter nav ----------
   .js-Gate: ohne JavaScript sind die Links ganz normal sichtbar */
.js .nav-link-type {
    display: inline-block; overflow: hidden; white-space: nowrap;
    width: 0; vertical-align: bottom;
}
.nav-link-type.typing-done {
    border-right: 2px solid #58A6FF;
    animation: cursor-fade 0.6s steps(1) 1.2s forwards;
}
@keyframes cursor-fade { to { border-right-color: transparent; } }

/* Navbar-Farben — die alten #000-Regeln waren tot (Bootstrap hat sie
   per Spezifität überschrieben). Jetzt explizit und lesbar. */
.navbar-dark .navbar-nav .nav-link { color: #C9D1D9; font-size: 13px; }
.navbar-dark .navbar-nav .nav-link:hover { color: #f00; }
.navbar-nav .nav-item { margin-left: 15px; }
.navbar-nav .nav-item .icon { color: #aba5a5; font-size: 18px; }
.navbar-nav .nav-item .icon:hover { color: #f00; }

/* Headings */
h1, h2 { font-size: 1.75rem; }
h3, h4, h5 { font-size: 1.45rem; }

/* ---------- footer ---------- */
footer {
    background-color: #161B22;
    border-top: 1px solid #21262D;
    padding: 24px 0;
    color: #8B949E;
    margin-top: 40px;
    font-size: 13px;
}
.footer-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.footer-links {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 6px 4px; list-style: none; padding: 0; margin: 0;
}
.footer-links li a {
    color: #8B949E; padding: 4px 8px; border-radius: 2px;
    font-size: 13px; display: flex; align-items: center;
    gap: 5px; transition: color 0.15s;
}
.footer-links li a:hover { color: #58A6FF; text-decoration: none; }
.footer-links li a .icon { font-size: 15px; }
.footer-copy { color: #6E7681; font-size: 12px; text-align: center; }
.footer-copy a { color: #6E7681; }
.footer-copy a:hover { color: #58A6FF; }

/* ---------- code blocks ----------
   .highlight + .snippet-clipboard-content hatten identische
   ~60 Zeilen — zusammengefasst über :is() */
:is(.highlight, .snippet-clipboard-content) {
    background-color: #21262D !important;
    color: #C9D1D9 !important;
    border-radius: 5px !important;
    padding: 12px !important;
    margin: 16px 0 !important;
    overflow: auto !important;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.7) !important;
}
:is(.highlight, .snippet-clipboard-content) pre {
    background-color: transparent !important;
    color: inherit !important;
    font-family: 'Fira Code', monospace !important;
    font-size: 14px !important;
    line-height: 1.6 !important;
    margin: 0 !important;
}
:is(.highlight, .snippet-clipboard-content) :is(.hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-symbol, .hljs-bullet, .hljs-link) {
    color: #FF7B72 !important;
}
:is(.highlight, .snippet-clipboard-content) :is(.hljs-string, .hljs-title, .hljs-name, .hljs-type, .hljs-attr) {
    color: #A5D6FF !important;
}
:is(.highlight, .snippet-clipboard-content) :is(.hljs-comment, .hljs-quote) {
    color: #8B949E !important;
    font-style: italic !important;
}
:is(.highlight, .snippet-clipboard-content):hover {
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.2) !important;
    transform: scale(1.02) !important;
}
:is(.highlight, .snippet-clipboard-content)::-webkit-scrollbar { width: 8px; height: 8px; }
:is(.highlight, .snippet-clipboard-content)::-webkit-scrollbar-thumb {
    background-color: #444C56 !important; border-radius: 10px !important;
}
:is(.highlight, .snippet-clipboard-content)::-webkit-scrollbar-track { background-color: #0D1117 !important; }

/* ---------- README ToC in Modals ---------- */
.readme-toc {
    background-color: #161B22;
    border: 1px solid #05172c;
    border-radius: 2px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 0.9rem;
}
.readme-toc strong {
    display: block; color: #C9D1D9; margin-bottom: 8px;
    font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em;
}
.readme-toc ol { margin: 0; padding-left: 18px; }
.readme-toc li { padding: 2px 0; }
.readme-toc a { color: #58A6FF; }
.readme-toc a:hover { color: #1F6FEB; text-decoration: underline; }

/* ---------- responsive + reduced motion ---------- */
@media (max-width: 768px) {
    .footer-image { height: auto; width: 100%; margin: 20px 0; }
}
@media (prefers-reduced-motion: reduce) {
    .modal.fade .modal-dialog { transition: none; }
    :is(.highlight, .snippet-clipboard-content):hover { transform: none !important; }
}
</style>

<script>
/* ==================================================================
   Lazy MathJax — lädt ERST beim ersten Modal-Öffnen (bzw. wenn ein
   Post `math: true` im Front Matter hat). Vorher hat jede Seite
   ~1MB MathJax gezogen, auch der Devlog ohne eine einzige Formel.
   ================================================================== */
var mathJaxPromise = null;

function ensureMathJax(autoTypeset) {
    if (window.MathJax && window.MathJax.typesetPromise) return Promise.resolve();
    if (!mathJaxPromise) {
        mathJaxPromise = new Promise(function (resolve) {
            window.MathJax = {
                tex: {
                    inlineMath: [['\\(', '\\)'], ['$', '$']],
                    displayMath: [['$$', '$$']]
                },
                options: {
                    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
                },
                startup: { typeset: !!autoTypeset }
            };
            var s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js';
            s.async = true;
            s.onload = function () {
                (MathJax.startup && MathJax.startup.promise
                    ? MathJax.startup.promise : Promise.resolve()).then(resolve, resolve);
            };
            s.onerror = resolve; /* CDN down → README trotzdem anzeigen */
            document.head.appendChild(s);
        });
    }
    return mathJaxPromise;
}

/* ==================================================================
   loadReadme — branch-sensitiv (main vs. master), ToC-Listener
   bleiben diesmal erhalten (kein innerHTML-Reset mehr)
   ================================================================== */
function loadReadme(repoFullName, index, branch) {
    var container = document.getElementById('repoContent-' + index);

    fetch('https://api.github.com/repos/' + repoFullName + '/readme', {
        headers: { 'Accept': 'application/vnd.github.v3.html' }
    })
    .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.text();
    })
    .then(function (data) {
        /* relative Bildpfade → raw.githubusercontent, mit echtem Branch */
        var repoUrl = 'https://raw.githubusercontent.com/' + repoFullName + '/' + (branch || 'master') + '/';
        data = data.replace(/src="([^"]+)"/g, function (match, p1) {
            return (p1.indexOf('http') === 0 || p1.indexOf('//') === 0)
                ? match : 'src="' + repoUrl + p1 + '"';
        });

        /* <a> um <img> strippen */
        data = data.replace(/<a[^>]*>\s*(<img[^>]*\/?>)\s*<\/a>/gi, '$1');

        container.innerHTML = data;

        /* Headings bereinigen, eigene IDs vergeben, Slug-Map bauen */
        var slugMap = {};
        container.querySelectorAll('h1,h2,h3,h4,h5').forEach(function (h, i) {
            var githubSlug = null;
            var innerAnchor = h.querySelector('a[id]');
            if (innerAnchor) {
                githubSlug = innerAnchor.id.replace(/^user-content-/, '');
                innerAnchor.replaceWith(...innerAnchor.childNodes);
            }
            var slug = h.textContent.trim().toLowerCase()
                .replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-');
            var newId = 'repoContent-' + index + '-' + (i + 1) + '-' + slug;
            h.id = newId;
            slugMap[slug] = newId;
            if (githubSlug) slugMap[githubSlug] = newId;
        });

        /* interne Anker (ToC etc.) auf neue IDs umlenken */
        container.querySelectorAll('a[href^="#"]').forEach(function (a) {
            var raw = a.getAttribute('href').replace(/^#/, '').replace(/^user-content-/, '');
            var newId = slugMap[raw];
            if (newId) {
                a.setAttribute('href', '#' + newId);
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    scrollModalTo(container.id, newId);
                });
            } else {
                a.addEventListener('click', function (e) { e.preventDefault(); });
            }
        });

        /* Mathe NUR im Modal typesetten — kein innerHTML-Reset,
           damit die Listener oben überleben */
        ensureMathJax().then(function () {
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([container]).catch(function (err) {
                    console.error('MathJax typeset error:', err);
                });
            }
        });
    })
    .catch(function () {
        container.innerHTML = '<p>README could not be loaded.</p>';
    });
}

/* Anker im Modal-Body anscrollen */
function scrollModalTo(modalBodyId, targetId) {
    var modalBody = document.getElementById(modalBodyId);
    var target = document.getElementById(targetId);
    if (!modalBody || !target) return;
    var top = 0, el = target;
    while (el && el !== modalBody) {
        top += el.offsetTop;
        el = el.offsetParent;
    }
    modalBody.scrollTo({ top: top - 16, behavior: 'smooth' });
}

/* ==================================================================
   Typewriter — respektiert prefers-reduced-motion
   ================================================================== */
(function () {
    var SPEED = 55; /* ms pro Zeichen */
    var reduced = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function boot() {
        var spans = document.querySelectorAll('.nav-link-type');
        var delay = 120;

        spans.forEach(function (span) {
            var text = span.textContent.trim();
            span.textContent = '';

            if (reduced) { /* keine Animation gewünscht → sofort anzeigen */
                span.textContent = text;
                span.style.width = 'auto';
                span.classList.add('typing-done');
                return;
            }

            /* Breite messen, ohne Layout zu verschieben */
            var ghost = document.createElement('span');
            ghost.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:inherit;';
            ghost.textContent = text;
            document.body.appendChild(ghost);
            var fullWidth = ghost.offsetWidth;
            document.body.removeChild(ghost);

            span.style.width = '0';
            var i = 0;
            setTimeout(function type() {
                if (i < text.length) {
                    span.textContent += text[i];
                    span.style.width = ((i + 1) / text.length * fullWidth) + 'px';
                    i++;
                    setTimeout(type, SPEED);
                } else {
                    span.style.width = fullWidth + 'px';
                    span.classList.add('typing-done');
                }
            }, delay);

            delay += text.length * SPEED + 180;
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
    } else {
        boot();
    }
})();
